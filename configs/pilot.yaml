study: marc_en_zh_pilot
seed: 42
source_language: en
target_language: zh
num_labels: 5
train_samples: 10000
target_unlabeled_samples: 10000
# One fixed 50:50 split of the original 5,000 English development examples.
selection_samples: 2500
calibration_samples: 2500
epochs: 2
max_length: 128
body_max_tokens: 110
input_fields: body_title_category
train_batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 0.00002
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
gradient_checkpointing: true
precision: fp16
dann_max_lambda: 0.1
ece_bins: 15
num_workers: 0
cpu_threads: 4
